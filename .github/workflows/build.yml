name: Build Solidity for Termux (all architectures)

on:
  workflow_dispatch:
    inputs:
      solc_version:
        description: "Solidity version tag (e.g. 0.8.18)"
        required: true
        default: "0.8.18"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, arm, i686, x86_64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Set lowercase repository owner
        id: prep
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile solc for ${{ matrix.arch }}
        env:
          TARGET_VERSION: ${{ inputs.solc_version }}
          TARGET_ARCH: ${{ matrix.arch }}
          IMAGE_NAME: ghcr.io/${{ steps.prep.outputs.owner }}/solc-termux-builder:latest
        run: |
          mkdir -p dist
          docker run --rm \
            -v "${{ github.workspace }}/dist:/dist" \
            "${IMAGE_NAME}" bash -c "
              /workdir/build-solc.sh '${TARGET_VERSION}' '${TARGET_ARCH}' &&
              cp /workdir/solidity/build/solc/solc /dist/solc-${TARGET_VERSION}-${TARGET_ARCH}
            "

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: solc-${{ inputs.solc_version }}-${{ matrix.arch }}
          path: dist/solc-${{ inputs.solc_version }}-${{ matrix.arch }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download all architecture binaries
        uses: actions/download-artifact@v4
        with:
          pattern: solc-${{ inputs.solc_version }}-*
          path: release-assets
          merge-multiple: true

      - name: List assets to publish
        run: ls -la release-assets

      - name: Create or update GitHub Release
        run: |
          TAG="v${{ inputs.solc_version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — uploading/replacing assets"
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* \
              --title "solc ${{ inputs.solc_version }} (Termux)" \
              --notes "Solidity ${{ inputs.solc_version }} compiled for Termux/Android: aarch64, arm, i686, x86_64."
          fi

